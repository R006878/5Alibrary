<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ============================================================
// SEED DATA
// ============================================================
const seedUsers = [];
const seedBooks = [];
const seedBorrowRecords = [];
const seedAudits = [];

// ============================================================
// SUPABASE SQL SCRIPT
// ============================================================
const SUPABASE_SQL = `-- 圖書館管理系統 SQL 初始化腳本
CREATE TABLE IF NOT EXISTS books (
  id VARCHAR(50) PRIMARY KEY, title VARCHAR(255) NOT NULL,
  category VARCHAR(100),
  status VARCHAR(20) DEFAULT 'available',
  borrower_id VARCHAR(7), borrower_name VARCHAR(100),
  borrow_date VARCHAR(20), due_date VARCHAR(20)
);
CREATE TABLE IF NOT EXISTS lib_users (
  employee_id VARCHAR(7) PRIMARY KEY, name VARCHAR(100) NOT NULL,
  role VARCHAR(20) DEFAULT 'user', password VARCHAR(255) NOT NULL,
  created_at VARCHAR(20) NOT NULL
);
CREATE TABLE IF NOT EXISTS borrow_records (
  id VARCHAR(50) PRIMARY KEY, book_id VARCHAR(50) NOT NULL,
  book_title VARCHAR(255) NOT NULL, employee_id VARCHAR(7) NOT NULL,
  employee_name VARCHAR(100) NOT NULL, borrow_date VARCHAR(20) NOT NULL,
  expected_return_date VARCHAR(20) NOT NULL, actual_return_date VARCHAR(20),
  status VARCHAR(20) DEFAULT 'active'
);
CREATE TABLE IF NOT EXISTS audit_sessions (
  id VARCHAR(50) PRIMARY KEY, audit_date VARCHAR(20) NOT NULL,
  auditor_id VARCHAR(7) NOT NULL, auditor_name VARCHAR(100) NOT NULL,
  total_books INT NOT NULL, present_count INT NOT NULL,
  missing_count INT NOT NULL, maintenance_count INT NOT NULL,
  notes TEXT, details JSONB NOT NULL
);
INSERT INTO lib_users (employee_id,name,role,password,created_at)
VALUES ('0000001','圖書管理員','admin','adminpassword','2026-06-09')
ON CONFLICT (employee_id) DO NOTHING;`;

// ============================================================
// DATA ENGINE (LocalStorage + Supabase)
// ============================================================
const PFX = 'lib_sys_';
const K_BOOKS = PFX+'books', K_USERS = PFX+'users', K_BORROWS = PFX+'borrows', K_AUDITS = PFX+'audits', K_CFG = PFX+'sb_config';

// Data stored in Supabase only
function getCfg() {
  try { const d = localStorage.getItem(K_CFG); if(d) { const p=JSON.parse(d); return {url:p.url||'',anonKey:p.anonKey||'',isConnected:!!p.isConnected}; } } catch(e){}
  return {url:'',anonKey:'',isConnected:false};
}
let _sbClient = null;
function getSB() {
  const c = getCfg();
  if (c.isConnected && c.url && c.anonKey) {
    if (!_sbClient) {
      try { _sbClient = supabase.createClient(c.url, c.anonKey, {auth:{persistSession:false}}); } catch(e){ return null; }
    }
    return _sbClient;
  }
  return null;
}
async function testSBConfig(url, anonKey) {
  if (!url||!anonKey) return {success:false,error:'網址與 Anon Key 不能為空'};
  try {
    const tmp = supabase.createClient(url, anonKey, {auth:{persistSession:false}});
    const {error} = await tmp.from('books').select('id').limit(1);
    if (error) {
      if (error.code==='PGRST116'||error.message.includes('does not exist')) {
        localStorage.setItem(K_CFG, JSON.stringify({url,anonKey,isConnected:true}));
        _sbClient = tmp;
        return {success:true, error:'連線成功！但尚未建立資料表，請執行 SQL 初始化腳本。'};
      }
      return {success:false,error:`連線失敗: ${error.message}`};
    }
    localStorage.setItem(K_CFG, JSON.stringify({url,anonKey,isConnected:true}));
    _sbClient = tmp;
    return {success:true};
  } catch(e){ return {success:false,error:e.message||'連線異常'}; }
}
function disconnectSB() {
  const c = getCfg(); c.isConnected=false;
  localStorage.setItem(K_CFG, JSON.stringify(c)); _sbClient=null;
}

async function fetchBooks() {
  const sb = getSB();
  if (!sb) return [];
  const {data,error}=await sb.from('books').select('*').order('id',{ascending:true});
  if(!error&&data) return data.map(b=>({id:b.id,title:b.title,category:b.category||'',status:b.status||'available',borrowerId:b.borrower_id||null,borrowerName:b.borrower_name||null,borrowDate:b.borrow_date||null,dueDate:b.due_date||null}));
  return [];
}
async function saveBook(book) {
  const sb = getSB(); if(!sb) return;
  await sb.from('books').upsert({id:book.id,title:book.title,category:book.category,status:book.status,borrower_id:book.borrowerId,borrower_name:book.borrowerName,borrow_date:book.borrowDate,due_date:book.dueDate});
}
async function deleteBook(id) {
  const sb = getSB(); if(!sb) return;
  await sb.from('books').delete().eq('id',id);
}
async function fetchUsers() {
  const sb = getSB();
  if (!sb) return [];
  const {data,error}=await sb.from('lib_users').select('*').order('employee_id',{ascending:true});
  if(!error&&data) return data.map(u=>({employeeId:u.employee_id,name:u.name,role:u.role||'user',password:u.password,createdAt:u.created_at}));
  return [];
}
async function saveUser(user) {
  const sb = getSB(); if(!sb) return;
  await sb.from('lib_users').upsert({employee_id:user.employeeId,name:user.name,role:user.role,password:user.password,created_at:user.createdAt});
}
async function deleteUser(eid) {
  const sb = getSB(); if(!sb) return;
  await sb.from('lib_users').delete().eq('employee_id',eid);
}
async function fetchBorrows() {
  const sb = getSB();
  if (!sb) return [];
  const {data,error}=await sb.from('borrow_records').select('*').order('borrow_date',{ascending:false});
  if(!error&&data) return data.map(r=>({id:r.id,bookId:r.book_id,bookTitle:r.book_title,employeeId:r.employee_id,employeeName:r.employee_name,borrowDate:r.borrow_date,expectedReturnDate:r.expected_return_date,actualReturnDate:r.actual_return_date||null,status:r.status||'active'}));
  return [];
}
async function saveBorrow(rec) {
  const sb = getSB(); if(!sb) return;
  await sb.from('borrow_records').upsert({id:rec.id,book_id:rec.bookId,book_title:rec.bookTitle,employee_id:rec.employeeId,employee_name:rec.employeeName,borrow_date:rec.borrowDate,expected_return_date:rec.expectedReturnDate,actual_return_date:rec.actualReturnDate,status:rec.status});
}
async function fetchAudits() {
  const sb = getSB();
  if (!sb) return [];
  const {data,error}=await sb.from('audit_sessions').select('*').order('audit_date',{ascending:false});
  if(!error&&data) return data.map(a=>({id:a.id,auditDate:a.audit_date,auditorId:a.auditor_id,auditorName:a.auditor_name,totalBooks:a.total_books,presentCount:a.present_count,missingCount:a.missing_count,maintenanceCount:a.maintenance_count,notes:a.notes||'',details:Array.isArray(a.details)?a.details:[]}));
  return [];
}
async function saveAudit(audit) {
  const sb = getSB(); if(!sb) return;
  await sb.from('audit_sessions').upsert({id:audit.id,audit_date:audit.auditDate,auditor_id:audit.auditorId,auditor_name:audit.auditorName,total_books:audit.totalBooks,present_count:audit.presentCount,missing_count:audit.missingCount,maintenance_count:audit.maintenanceCount,notes:audit.notes,details:audit.details});
}

// ============================================================
// LOGIN SCREEN
// ============================================================
function LoginScreen({onLoginSuccess, users}) {
  const [empId, setEmpId] = useState('');
  const [password, setPassword] = useState('');
  const [showPwd, setShowPwd] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault(); setError('');
    const id = empId.trim();
    if (id.length !== 7) { setError('員工編號必須為剛好 7 位字元。'); return; }
    const user = users.find(u => u.employeeId.toLowerCase() === id.toLowerCase());
    if (!user) { setError('找不到該員工編號，請確認是否已註冊，或聯絡管理員。'); return; }
    if (user.password !== password) { setError('密碼不正確，請重新輸入。'); return; }
    onLoginSuccess(user);
  };

  return (
    <div className="min-h-screen flex flex-col justify-center py-12 px-4 font-sans" style={{backgroundColor:"#1a2a1a"}}>
      <div className="mx-auto w-full max-w-md">
        <div className="flex justify-center">
          <div className="p-3 rounded-2xl shadow-lg text-white" style={{background:"linear-gradient(135deg,#1a4a1a,#4a8a4a)"}}>
            <Icons.BookOpen size={40}/>
          </div>
        </div>
        <h2 className="mt-6 text-center text-3xl font-bold" style={{color:"#a8d5a8"}}>內部圖書館管理系統</h2>
        <p className="mt-2 text-center text-sm" style={{color:"#5a8a5a"}}>請以七碼員工編號登入以點閱與辦理借還</p>
      </div>
      <div className="mt-8 mx-auto w-full max-w-md">
        <div className="py-8 px-6 shadow-sm rounded-xl" style={{background:"#162616",border:"1px solid #3a6a3a"}}>
          <form className="space-y-5" onSubmit={handleSubmit}>
            {error && (
              <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-md flex items-start gap-2">
                <Icons.AlertCircle size={16} cls="text-red-500 shrink-0 mt-0.5"/>
                <span className="text-sm text-red-700">{error}</span>
              </div>
            )}
            <div>
              <label className="block text-sm font-medium text-gray-200">員工編號 (限定 7 碼)</label>
              <div className="mt-1 relative">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icons.UserCheck size={18} cls="text-gray-500"/></div>
                <input type="text" required maxLength={7} className="block w-full pl-10 pr-3 py-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" style={{background:"#0d1f0d",border:"1px solid #3a6a3a",color:"#c8e6c8"}} placeholder="範例: 0804431" value={empId} onChange={e=>setEmpId(e.target.value.replace(/[^a-zA-Z0-9]/g,''))}/>
              </div>
              <p className="mt-1 text-xs text-gray-500">目前輸入 {empId.length}/7 碼</p>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-200">密碼</label>
              <div className="mt-1 relative">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icons.Lock size={18} cls="text-gray-500"/></div>
                <input type={showPwd?'text':'password'} required className="block w-full pl-10 pr-10 py-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" style={{background:"#0d1f0d",border:"1px solid #3a6a3a",color:"#c8e6c8"}} placeholder="請輸入您的密碼" value={password} onChange={e=>setPassword(e.target.value)}/>
                <button type="button" className="absolute inset-y-0 right-0 pr-3 flex items-center" style={{color:"#6aaa6a"}} onClick={()=>setShowPwd(!showPwd)}>
                  {showPwd ? <Icons.EyeOff size={18} cls="text-gray-500"/> : <Icons.Eye size={18} cls="text-gray-500"/>}
                </button>
              </div>
            </div>

            <button type="submit" className="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white focus:outline-none cursor-pointer uppercase" style={{background:"linear-gradient(135deg,#2d6a2d,#4a8a4a)"}}>
              登入系統
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

function SupabaseConfigModal({isOpen, onClose, onConfigChanged}) {
  const [url, setUrl] = useState('');
  const [anonKey, setAnonKey] = useState('');
  const [connected, setConnected] = useState(false);
  const [testing, setTesting] = useState(false);
  const [msg, setMsg] = useState(null);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (isOpen) { const c=getCfg(); setUrl(c.url); setAnonKey(c.anonKey); setConnected(c.isConnected); setMsg(null); }
  }, [isOpen]);
  if (!isOpen) return null;

  const handleTest = async () => {
    setTesting(true); setMsg(null);
    const res = await testSBConfig(url.trim(), anonKey.trim());
    setTesting(false);
    if (res.success) { setConnected(true); setMsg({text:res.error||'連線成功！已啟用 Supabase 雲端同步模式。',isErr:!!res.error}); onConfigChanged(); }
    else setMsg({text:res.error||'連線測試失敗',isErr:true});
  };
  const handleDisconnect = () => {
    disconnectSB(); setConnected(false); setUrl(''); setAnonKey('');
    setMsg({text:'已斷開連接，切換回 LocalStorage 離線模式。',isErr:false}); onConfigChanged();
  };
  const handleCopy = () => { navigator.clipboard.writeText(SUPABASE_SQL); setCopied(true); setTimeout(()=>setCopied(false),2000); };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto">
      <div className="flex items-center justify-center min-h-screen p-4">
        <div className="fixed inset-0 bg-slate-950/40 backdrop-blur-sm" onClick={onClose}/>
        <div className="relative rounded-xl shadow-2xl w-full max-w-2xl" style={{background:"#1e301e",border:"1px solid #3a6a3a"}}>
          <div className="bg-slate-50 px-6 py-4 border-b flex items-center justify-between">
            <h3 className="text-lg font-bold text-white flex items-center gap-2"><Icons.Database size={18} cls="text-indigo-600"/> Supabase 雲端資料庫設定</h3>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 cursor-pointer"><Icons.X size={18}/></button>
          </div>
          <div className="px-6 py-6 space-y-5 max-h-[70vh] overflow-y-auto">
            <div className="p-4 rounded-lg flex gap-3 text-sm" style={{background:"#1a2a0a",border:"1px solid #5a7a2a",color:"#c8d8a8"}}>
              <Icons.Info size={18} cls="text-amber-500 shrink-0 mt-0.5"/>
              <div>本應用支援 <strong>LocalStorage 本機</strong>與 <strong>Supabase 雲端同步</strong>兩種模式。貼入金鑰後可多人即時同步。</div>
            </div>
            <div className="space-y-3">
              <div>
                <label className="block text-sm font-semibold text-gray-200">Supabase 專案網址</label>
                <input type="text" className="mt-1 block w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} placeholder="https://your-project-id.supabase.co" value={url} onChange={e=>setUrl(e.target.value)}/>
              </div>
              <div>
                <label className="block text-sm font-semibold text-gray-200">Anon Key / Public API Key</label>
                <input type="password" className="mt-1 block w-full px-3 py-2 border rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-green-500" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." value={anonKey} onChange={e=>setAnonKey(e.target.value)}/>
              </div>
            </div>
            {msg && <div className={`p-4 rounded-lg text-sm border ${msg.isErr?'bg-red-50 text-red-800 border-red-200':'bg-green-50 text-green-800 border-green-200'}`}>{msg.text}</div>}
            <div className="flex gap-3">
              <button disabled={testing||!url||!anonKey} onClick={handleTest} className="flex-1 py-2 px-4 disabled:opacity-50 text-white rounded-lg text-sm font-semibold cursor-pointer flex items-center justify-center gap-2" style={{background:"linear-gradient(135deg,#2d6a2d,#4a8a4a)"}}>
                {testing && <Icons.Loader2 size={14}/>} 連線測試並儲存
              </button>
              {connected && <button onClick={handleDisconnect} className="py-2 px-4 text-rose-400 border border-rose-800 rounded-lg text-sm font-semibold cursor-pointer" style={{background:"#2a1010"}}>切回離線模式</button>}
            </div>
            <div className="border-t pt-5 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-sm font-bold text-white">資料庫 SQL 初始化腳本</span>
                <div className="flex gap-2">
                  <button onClick={handleCopy} className="px-2.5 py-1 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded flex items-center gap-1.5 cursor-pointer">
                    {copied?<Icons.Check size={12} cls="text-green-600"/>:<Icons.Copy size={12}/>} {copied?'已複製':'複製 SQL'}
                  </button>
                  <a href="https://supabase.com" target="_blank" rel="noreferrer" className="px-2.5 py-1 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded flex items-center gap-1">前往 Supabase <Icons.ExternalLink size={10}/></a>
                </div>
              </div>
              <p className="text-xs text-gray-400">請在 Supabase 的 <strong>SQL Editor</strong> 執行此腳本，建立所需資料表。</p>
              <pre className="p-3 bg-slate-900 text-slate-300 text-[10px] font-mono rounded-lg overflow-x-auto max-h-40 leading-relaxed">{SUPABASE_SQL}</pre>
            </div>
          </div>
          <div className="px-6 py-4 flex justify-end border-t" style={{background:"#162616",borderColor:"#3a6a3a"}}>
            <button onClick={onClose} className="px-4 py-2 border text-sm font-semibold rounded-lg cursor-pointer" style={{borderColor:"#3a6a3a",color:"#a8d5a8",background:"#162616"}}>關閉</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// BOOK CATALOG
// ============================================================
function BookCatalog({books, currentUser, onBorrowBook, onReturnBook}) {
  const [q, setQ] = useState('');
  const [catFilter, setCatFilter] = useState('');
  const [statusFilter, setStatusFilter] = useState('');
  const [viewMode, setViewMode] = useState('grid');
  const cats = [...new Set(books.map(b=>b.category).filter(Boolean))];
  const filtered = books.filter(b => {
    const sq = q.toLowerCase().trim();
    const ms = !sq || b.title.toLowerCase().includes(sq) || (b.borrowerId&&b.borrowerId.toLowerCase()===sq) || (b.borrowerName&&b.borrowerName.toLowerCase().includes(sq));
    const mc = !catFilter || b.category===catFilter;
    let mst = true;
    if (statusFilter==='available') mst = b.status==='available';
    else if (statusFilter==='borrowed') mst = b.status==='borrowed';
    else if (statusFilter==='my-borrowed') mst = b.status==='borrowed'&&b.borrowerId===currentUser?.employeeId;
    else if (statusFilter==='maintenance') mst = b.status==='maintenance'||b.status==='lost';
    return ms&&mc&&mst;
  });

  const StatusBadge = ({book}) => {
    if (book.status==='available') return <span className="inline-flex items-center gap-1 font-bold text-emerald-600"><Icons.CheckCircle2 size={14} cls="text-emerald-500 shrink-0"/> 在庫中 (可借閱)</span>;
    if (book.status==='borrowed') return <div className="flex flex-col gap-0.5"><span className="inline-flex items-center gap-1 font-bold text-blue-600"><Icons.Clock size={14} cls="text-blue-500 shrink-0"/> 借出中</span><span className="text-[10px] text-gray-500">借閱人: {book.borrowerName} ({book.borrowerId})<br/>應還日: {book.dueDate}</span></div>;
    if (book.status==='maintenance') return <span className="inline-flex items-center gap-1 font-bold text-amber-600"><Icons.AlertCircle size={14} cls="text-amber-500 shrink-0"/> 保養維護中</span>;
    return <span className="inline-flex items-center gap-1 font-bold text-rose-600"><Icons.AlertCircle size={14} cls="text-rose-500 shrink-0"/> 已通報遺失</span>;
  };
  const ActionBtn = ({book}) => {
    if (!currentUser) return <span className="text-slate-400 text-xs">登入後可借閱</span>;
    if (book.status==='available') return <button onClick={()=>onBorrowBook(book.id)} className="px-3.5 py-1.5 text-white font-bold rounded-lg shadow-sm cursor-pointer text-xs" style={{background:"linear-gradient(135deg,#2d6a2d,#4a8a4a)"}}>立即借閱</button>;
    if (book.status==='borrowed'&&book.borrowerId===currentUser.employeeId) return <button onClick={()=>onReturnBook(book.id)} className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg cursor-pointer text-xs">辦理還書</button>;
    if (book.status==='borrowed') return <span className="text-[10px] text-slate-400 font-semibold bg-slate-100 px-2 py-1 rounded">已被占借</span>;
    return <span className="text-[10px] text-slate-400 font-semibold bg-slate-100 px-2 py-1 rounded">暫停流通</span>;
  };

  return (
    <div className="space-y-6">
      <div className="p-5 rounded-2xl space-y-4" style={{background:"#1e301e",border:"1px solid #3a6a3a",boxShadow:"0 1px 6px rgba(139,100,60,0.10)"}}>
        <h2 className="text-xl font-bold flex items-center gap-2" style={{color:"#a8d5a8"}}><Icons.BookOpen size={20} cls=""/> 全館圖書檢索庫</h2>
        <div className="relative">
          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icons.Search size={18} cls="text-gray-500"/></div>
          <input type="text" className="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="請輸入：書名，或輸入 7 碼員工編號查詢其借書單..." value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
        <div className="flex flex-wrap gap-2 items-center justify-between">
          <div className="flex flex-wrap gap-2 text-xs">
            <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 font-semibold focus:outline-none cursor-pointer">
              <option value="">所有分類</option>
              {cats.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            {[['','全部書籍','slate'],['available','在架上','emerald'],['borrowed','借出中','blue'],currentUser&&['my-borrowed','我借出的','violet'],['maintenance','保養/遺失','amber']].filter(Boolean).map(([v,label,color])=>(
              <button key={v} onClick={()=>setStatusFilter(v)} className={`px-3 py-2 rounded-lg font-semibold cursor-pointer transition-all ${statusFilter===v?`bg-${color}-600 text-white shadow-sm`:'bg-slate-50 text-slate-600 hover:bg-slate-100'}`}>{label} ({v===''?books.length:v==='available'?books.filter(b=>b.status==='available').length:v==='borrowed'?books.filter(b=>b.status==='borrowed').length:v==='my-borrowed'?books.filter(b=>b.status==='borrowed'&&b.borrowerId===currentUser?.employeeId).length:books.filter(b=>b.status==='maintenance'||b.status==='lost').length})</button>
            ))}
          </div>
          <div className="flex items-center gap-1 border border-slate-200 rounded-lg p-0.5 bg-slate-50">
            <button onClick={()=>setViewMode('grid')} className={`p-1.5 rounded cursor-pointer ${viewMode==='grid'?'bg-white shadow-sm text-indigo-600':'text-slate-400'}`}><Icons.Grid size={14}/></button>
            <button onClick={()=>setViewMode('list')} className={`p-1.5 rounded cursor-pointer ${viewMode==='list'?'bg-white shadow-sm text-indigo-600':'text-slate-400'}`}><Icons.List size={14}/></button>
          </div>
        </div>
      </div>

      {filtered.length===0 ? (
        <div className="bg-white rounded-2xl p-12 border border-slate-100 text-center text-gray-400">
          <Icons.Bookmark size={44} cls="text-slate-300 mx-auto mb-3"/>
          <p className="text-base font-semibold text-gray-200">查無任何相符圖書</p>
          <p className="text-xs text-slate-400 mt-1">請嘗試修改關鍵字或重設篩選條件。</p>
        </div>
      ) : viewMode==='grid' ? (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          {filtered.map(b=>(
            <div key={b.id} className="rounded-2xl overflow-hidden hover:shadow-lg transition-all flex flex-col justify-between" style={{background:"#1e301e",border:"1px solid #3a6a3a"}}>
              <div className="p-5 space-y-4">
                <div className="flex items-start justify-between">
                  <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-100 text-gray-300">{b.category||'未分類'}</span>
                  <span className="text-xs font-mono font-semibold text-gray-500">編號: {b.id}</span>
                </div>
                <div className="space-y-1">
                  <h3 className="font-bold text-white text-base line-clamp-2" title={b.title}>{b.title}</h3>

                </div>
                <div className="pt-2 border-t border-slate-50 flex items-center justify-between text-xs text-gray-500">

                </div>
              </div>
              <div className="px-5 py-3.5 border-t flex items-center justify-between text-xs" style={{background:"#162616",borderColor:"#3a6a3a"}}>
                <StatusBadge book={b}/>
                <ActionBtn book={b}/>
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div className="rounded-2xl overflow-hidden" style={{background:"#1e301e",border:"1px solid #3a6a3a"}}>
          <div className="overflow-x-auto">
            <table className="min-w-full divide-y divide-slate-100">
              <thead className="text-xs font-bold" style={{background:"#162616",color:"#6aaa6a"}}>
                <tr>
                  {['書籍編號','圖書名稱','分類','目前狀態','操作'].map((h,i)=><th key={i} scope="col" className={`px-6 py-3.5 ${i===4?'text-right':'text-left'}`}>{h}</th>)}
                </tr>
              </thead>
              <tbody className="divide-y text-xs" style={{background:"#1e301e",color:"#a8c8a8",borderColor:"#2a4a2a"}}>
                {filtered.map(b=>(
                  <tr key={b.id} className="hover:bg-green-950">
                    <td className="px-6 py-4 font-mono font-bold text-gray-400">{b.id}</td>
                    <td className="px-6 py-4"><div className="font-bold text-white text-sm">{b.title}</div></td>
                    <td className="px-6 py-4"><span className="inline-flex px-2 py-0.5 rounded text-[10px] font-bold bg-green-900 text-green-300">{b.category}</span></td>
                    <td className="px-6 py-4"><StatusBadge book={b}/></td>
                    <td className="px-6 py-4 text-right"><ActionBtn book={b}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function UserDashboard({currentUser, books, onReturnBook, onChangePassword, onLogout}) {
  const [oldPwd, setOldPwd] = useState('');
  const [newPwd, setNewPwd] = useState('');
  const [confirmPwd, setConfirmPwd] = useState('');
  const [updating, setUpdating] = useState(false);
  const [statusMsg, setStatusMsg] = useState(null);
  const myBooks = books.filter(b=>b.status==='borrowed'&&b.borrowerId===currentUser.employeeId);

  const handlePwdSubmit = async (e) => {
    e.preventDefault(); setStatusMsg(null);
    if (!oldPwd||!newPwd||!confirmPwd) { setStatusMsg({text:'所有欄位皆為必填。',isErr:true}); return; }
    if (newPwd!==confirmPwd) { setStatusMsg({text:'新密碼與確認密碼不一致。',isErr:true}); return; }
    if (newPwd.length<6) { setStatusMsg({text:'新密碼長度必須大於或等於 6 位。',isErr:true}); return; }
    setUpdating(true);
    const res = await onChangePassword(oldPwd, newPwd);
    setUpdating(false);
    if (res.success) { setStatusMsg({text:'密碼更新成功！',isErr:false}); setOldPwd(''); setNewPwd(''); setConfirmPwd(''); }
    else setStatusMsg({text:res.message,isErr:true});
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div className="lg:col-span-1 space-y-6">
        <div className="p-6 rounded-2xl space-y-4" style={{background:"#1e301e",border:"1px solid #3a6a3a"}}>
          <div className="flex items-center gap-4">
            <div className="p-3 bg-indigo-50 border border-indigo-100 rounded-xl text-indigo-600"><Icons.User size={22}/></div>
            <div><h3 className="font-bold text-white text-lg">{currentUser.name}</h3><p className="text-xs text-slate-400 font-mono">員工編號: {currentUser.employeeId}</p></div>
          </div>
          <div className="border-t pt-4 space-y-2 text-xs">
            <div className="flex justify-between"><span className="text-gray-500">系統角色</span><span className={`px-2 py-0.5 rounded font-bold ${currentUser.role==='admin'?'bg-rose-50 text-rose-700':'bg-slate-100 text-slate-700'}`}>{currentUser.role==='admin'?'系統管理者':'一般同仁'}</span></div>
            <div className="flex justify-between"><span className="text-gray-500">目前借用數</span><span className="font-bold text-white">{myBooks.length} 冊</span></div>
          </div>
          <button onClick={onLogout} className="w-full py-2 px-4 font-bold rounded-lg text-xs cursor-pointer" style={{background:"#162616",color:"#a8d5a8",border:"1px solid #3a6a3a"}}>登出系統</button>
        </div>

        <div className="p-6 rounded-2xl space-y-4" style={{background:"#1e301e",border:"1px solid #3a6a3a"}}>
          <h3 className="font-bold text-white text-sm flex items-center gap-2"><Icons.Key size={16} cls="text-indigo-500"/> 自身密碼更改</h3>
          <form onSubmit={handlePwdSubmit} className="space-y-3">
            {[['目前密碼','原核定密碼',oldPwd,setOldPwd],['新設定密碼','新密碼 (≥6碼)',newPwd,setNewPwd],['重複新密碼','再次輸入',confirmPwd,setConfirmPwd]].map(([label,ph,val,setter])=>(
              <div key={label}>
                <label className="block text-xs font-semibold text-gray-300 mb-1">{label}</label>
                <input type="password" required className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder={ph} value={val} onChange={e=>setter(e.target.value)}/>
              </div>
            ))}
            {statusMsg && <div className={`p-3 rounded-lg text-xs flex gap-1.5 border items-start ${statusMsg.isErr?'bg-rose-50 text-rose-800 border-rose-200':'bg-green-50 text-green-800 border-green-200'}`}>{statusMsg.isErr?<Icons.AlertCircle size={14} cls="text-rose-500 shrink-0"/>:<Icons.Check size={14} cls="text-green-500 shrink-0"/>}<span>{statusMsg.text}</span></div>}
            <button type="submit" disabled={updating} className="w-full py-2 text-white font-bold rounded-lg text-xs cursor-pointer flex items-center justify-center gap-1.5" style={{background:"#2d6a2d"}}>
              {updating&&<Icons.RefreshCw size={12} cls="animate-spin"/>} 更新新密碼
            </button>
          </form>
        </div>
      </div>

      <div className="lg:col-span-2">
        <div className="p-6 rounded-2xl min-h-96" style={{background:"#1e301e",border:"1px solid #3a6a3a"}}>
          <h3 className="text-base font-bold flex items-center gap-2 mb-4" style={{color:"#a8d5a8"}}><Icons.Calendar size={18} cls="text-indigo-600"/> 我的目前借調圖書</h3>
          {myBooks.length===0 ? (
            <div className="py-16 text-center text-slate-400 space-y-2">
              <Icons.Clock size={36} cls="text-slate-200 mx-auto"/>
              <p className="text-sm font-semibold text-gray-300">目前您手邊沒有任何借閱書籍</p>
              <p className="text-xs">歡迎前往「全館圖書檢索庫」挑選書籍借閱。</p>
            </div>
          ) : (
            <div className="divide-y divide-slate-100">
              {myBooks.map(b=>{
                const today=new Date(); const due=b.dueDate?new Date(b.dueDate):null; const overdue=due?today>due:false;
                return (
                  <div key={b.id} className="py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div className="space-y-1">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-mono font-bold bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">{b.id}</span>
                        <h4 className="font-bold text-white text-sm line-clamp-1">{b.title}</h4>
                      </div>
                      
                      <div className="flex flex-wrap gap-x-4 gap-y-1 text-[11px] font-semibold text-gray-400">
                        <span className="flex items-center gap-1"><Icons.Clock size={12}/> 借用: {b.borrowDate}</span>
                        <span className={`flex items-center gap-1 ${overdue?'text-red-600 font-bold':''}`}><Icons.Calendar size={12}/> 預還: {b.dueDate}{overdue?' (已逾期!)':''}</span>
                      </div>
                    </div>
                    <button onClick={()=>onReturnBook(b.id)} className="px-4 py-1.5 text-white font-bold rounded-lg text-xs cursor-pointer whitespace-nowrap" style={{background:"#2d6a2d"}}>立即辦理還書</button>
                  </div>
                );
              })}
            </div>
          )}
          <div className="pt-6 border-t text-xs text-slate-400 space-y-1 mt-4">
            <strong>借調使用須知：</strong>
            <p>1. 各部門同仁單次借書保留最長期限為 14 天，期滿需辦理歸還，以免影響他人借用權益。</p>

          </div>
        </div>
      </div>
    </div>
  );
}

function AdminPanel({books, users, borrowRecords, auditSessions, currentUser, onAddBook, onDeleteBook, onUpdateBook, onAddUser, onDeleteUser, onSaveAuditSession}) {
  const [tab, setTab] = useState('books');
  const [bookSearch, setBookSearch] = useState('');
  const [userSearch, setUserSearch] = useState('');
  const [borrowSearch, setBorrowSearch] = useState('');
  const [exportStart, setExportStart] = useState('');
  const [exportEnd, setExportEnd] = useState('');
  const [showBookForm, setShowBookForm] = useState(false);
  const [editingBookId, setEditingBookId] = useState(null);
  const [bookForm, setBookForm] = useState({id:'',title:'',category:'內科',status:'available'});
  const [showUserForm, setShowUserForm] = useState(false);
  const [userForm, setUserForm] = useState({employeeId:'',name:'',role:'user',password:''});
  const [userFormErr, setUserFormErr] = useState('');
  const [isAuditing, setIsAuditing] = useState(false);
  const [auditNotes, setAuditNotes] = useState('');
  const [auditSel, setAuditSel] = useState({});
  const [viewingAudit, setViewingAudit] = useState(null);

  const handleBookSubmit = (e) => {
    e.preventDefault();
    if (!bookForm.id.trim()||!bookForm.title.trim()) return;
    const fb = {id:bookForm.id.trim(),title:bookForm.title.trim(),category:bookForm.category.trim(),status:bookForm.status,borrowerId:null,borrowerName:null,borrowDate:null,dueDate:null};
    if (editingBookId) {
      const ex = books.find(b=>b.id===editingBookId);
      if (ex) { fb.borrowerId=ex.borrowerId; fb.borrowerName=ex.borrowerName; fb.borrowDate=ex.borrowDate; fb.dueDate=ex.dueDate; }
      if (fb.status==='available') { fb.borrowerId=null; fb.borrowerName=null; fb.borrowDate=null; fb.dueDate=null; }
      onUpdateBook(fb);
    } else {
      if (books.some(b=>b.id.toLowerCase()===fb.id.toLowerCase())) { alert('書籍編號重複，請換另一個編號。'); return; }
      onAddBook(fb);
    }
    setBookForm({id:'',title:'',category:'內科',status:'available'}); setShowBookForm(false); setEditingBookId(null);
  };
  const startEditBook = (b) => { setEditingBookId(b.id); setBookForm({id:b.id,title:b.title,category:b.category,status:b.status}); setShowBookForm(true); };

  const handleUserSubmit = (e) => {
    e.preventDefault(); setUserFormErr('');
    const eid = userForm.employeeId.trim();
    if (eid.length!==7) { setUserFormErr('員工編號長度必須精準符合 7 碼。'); return; }
    if (users.some(u=>u.employeeId.toLowerCase()===eid.toLowerCase())) { setUserFormErr('此員工編號已註冊！不可重複加入。'); return; }
    if (userForm.password.length<5) { setUserFormErr('密碼長度太弱，請設定至少 5 位字元。'); return; }
    onAddUser({employeeId:eid,name:userForm.name.trim(),role:userForm.role,password:userForm.password,createdAt:new Date().toISOString().split('T')[0]});
    setUserForm({employeeId:'',name:'',role:'user',password:''}); setShowUserForm(false);
  };

  const handleExportCSV = () => {
    let filtered = borrowRecords;
    if (exportStart) filtered=filtered.filter(r=>r.borrowDate>=exportStart);
    if (exportEnd) filtered=filtered.filter(r=>r.borrowDate<=exportEnd);
    if (borrowSearch) { const sq=borrowSearch.toLowerCase(); filtered=filtered.filter(r=>r.bookId.toLowerCase().includes(sq)||r.bookTitle.toLowerCase().includes(sq)||r.employeeId.toLowerCase().includes(sq)||r.employeeName.toLowerCase().includes(sq)); }
    let csv='\uFEFF借閱流水號,書籍編號,圖書標題,員工編號,同仁姓名,借書日期,預計還期,實際歸還日,流動狀態\n';
    filtered.forEach(r=>{ const t=r.bookTitle.replace(/"/g,'""'); csv+=`"${r.id}","${r.bookId}","${t}","${r.employeeId}","${r.employeeName}","${r.borrowDate}","${r.expectedReturnDate}","${r.actualReturnDate||'未還'}","${r.status==='returned'?'已歸還':r.status==='lost'?'申報遺失':'借閱中'}"\n`; });
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`圖書館借還書報表_${exportStart||'起'}_${exportEnd||'迄'}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  const handleStartAudit = () => {
    const sel={};
    books.forEach(b=>{ if(b.status==='borrowed')sel[b.id]='borrowed'; else if(b.status==='maintenance')sel[b.id]='maintenance'; else if(b.status==='lost')sel[b.id]='missing'; else sel[b.id]='present'; });
    setAuditSel(sel); setAuditNotes(''); setIsAuditing(true);
  };
  const handleSaveAudit = () => {
    const details = books.map(b=>({bookId:b.id,bookTitle:b.title,expectedStatus:b.status,actualStatus:auditSel[b.id]||'present'}));
    const sess={id:'AUD'+Math.floor(Math.random()*90000+10000),auditDate:new Date().toISOString().split('T')[0],auditorId:currentUser.employeeId,auditorName:currentUser.name,totalBooks:books.length,presentCount:Object.values(auditSel).filter(s=>s==='present'||s==='borrowed').length,missingCount:Object.values(auditSel).filter(s=>s==='missing').length,maintenanceCount:Object.values(auditSel).filter(s=>s==='maintenance').length,notes:auditNotes.trim()||'圖書清冊點班完成。',details};
    onSaveAuditSession(sess); setIsAuditing(false); setViewingAudit(sess);
  };

  const tabs = [
    {k:'books',icon:<Icons.BookOpen size={14}/>,label:'書籍清冊點存'},
    {k:'users',icon:<Icons.UserCheck size={14}/>,label:'同仁員編清單'},
    {k:'borrows',icon:<Icons.Clipboard size={14}/>,label:'借還紀錄與匯出'},
    {k:'audit',icon:<Icons.ClipboardCheck size={14}/>,label:'現場點班盤點'},
  ];

  return (
    <div className="space-y-6">
      <div className="p-2 rounded-xl flex flex-wrap gap-1" style={{background:"#162616",border:"1px solid #3a6a3a"}}>
        {tabs.map(t=>(
          <button key={t.k} onClick={()=>{setTab(t.k);setIsAuditing(false);}} style={tab===t.k?{background:'linear-gradient(135deg,#1a4a1a,#2d6a2d)',color:'#c8e6c8'}:{}} className={`flex-1 py-2.5 px-4 rounded-lg font-bold text-xs tracking-wide cursor-pointer transition-all flex items-center justify-center gap-1.5 ${tab===t.k?'':'text-stone-600 hover:bg-amber-50'}`}>
            {t.icon}{t.label}
          </button>
        ))}
      </div>

      {/* TAB: BOOKS */}
      {tab==='books' && (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center gap-3 bg-white p-5 rounded-xl border border-slate-100">
            <div className="relative flex-1">
              <Icons.Search size={16} cls="text-slate-400 absolute left-3 top-3"/>
              <input type="text" placeholder="輸入書名或書籍編號快速篩選..." className="w-full pl-9 pr-4 py-2 border rounded-lg text-xs" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} value={bookSearch} onChange={e=>setBookSearch(e.target.value)}/>
            </div>
            <button onClick={()=>{setEditingBookId(null);setBookForm({id:'',title:'',category:'內科',status:'available'});setShowBookForm(!showBookForm);}} className="py-2 px-4 text-white font-bold rounded-lg text-xs flex items-center gap-1.5 cursor-pointer self-start sm:self-auto" style={{background:"linear-gradient(135deg,#2d6a2d,#4a8a4a)"}}>
              <Icons.Plus size={14}/> 新增書籍
            </button>
          </div>

          {showBookForm && (
            <div className="bg-white p-6 border border-indigo-100 shadow-md rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white">{editingBookId?`正在編輯圖書: ${editingBookId}`:'新增一冊圖書到資料庫'}</h3>
              <form onSubmit={handleBookSubmit} className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                <div><label className="block text-gray-300 mb-1 font-semibold">書籍編號 *</label><input type="text" required disabled={!!editingBookId} className="w-full px-3 py-2 border rounded-lg focus:ring-1 focus:ring-indigo-500 disabled:bg-slate-100" placeholder="如: B00114" value={bookForm.id} onChange={e=>setBookForm({...bookForm,id:e.target.value.toUpperCase()})}/></div>
                <div className="md:col-span-2"><label className="block text-gray-300 mb-1 font-semibold">書籍名稱 *</label><input type="text" required className="w-full px-3 py-2 border rounded-lg focus:ring-1 focus:ring-green-500" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} placeholder="深入淺出設計模式" value={bookForm.title} onChange={e=>setBookForm({...bookForm,title:e.target.value})}/></div>

                <div><label className="block text-gray-300 mb-1 font-semibold">類別學門</label>
                  <select className="w-full px-3 py-2 border rounded-lg focus:ring-1 focus:ring-green-500 cursor-pointer" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} value={bookForm.category} onChange={e=>setBookForm({...bookForm,category:e.target.value})}>
                    {['內科','外科','教學','其他'].map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                <div><label className="block text-gray-300 mb-1 font-semibold">初始流通狀態</label>
                  <select className="w-full px-3 py-2 border rounded-lg focus:ring-1 focus:ring-green-500 cursor-pointer" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} value={bookForm.status} onChange={e=>setBookForm({...bookForm,status:e.target.value})}>
                    <option value="available">在庫 (Available)</option>
                    <option value="maintenance">保養維修 (Maintenance)</option>
                    <option value="lost">報失 (Lost)</option>
                  </select>
                </div>
                <div className="md:col-span-3 flex justify-end gap-2.5 pt-2">
                  <button type="button" onClick={()=>{setShowBookForm(false);setEditingBookId(null);}} className="px-4 py-2 border rounded-lg cursor-pointer" style={{borderColor:"#3a6a3a",color:"#a8d5a8",background:"#162616"}}>取消</button>
                  <button type="submit" className="px-5 py-2 text-white rounded-lg font-bold cursor-pointer" style={{background:"linear-gradient(135deg,#2d6a2d,#4a8a4a)"}}>儲存書籍</button>
                </div>
              </form>
            </div>
          )}

          <div className="rounded-xl overflow-hidden" style={{background:"#1e301e",border:"1px solid #3a6a3a"}}>
            <div className="overflow-x-auto">
              <table className="min-w-full divide-y divide-slate-100 text-xs text-gray-200">
                <thead className="font-bold text-left" style={{background:"#162616",color:"#6aaa6a"}}>
                  <tr>{['圖書編號','圖書標題規格','分類','狀態','現有借閱人','變更操作'].map((h,i)=><th key={i} scope="col" className={`px-6 py-3 ${i===5?'text-right':''}`}>{h}</th>)}</tr>
                </thead>
                <tbody className="divide-y" style={{background:"#1e301e",borderColor:"#2a4a2a"}}>
                  {books.filter(b=>{const sq=bookSearch.toLowerCase();return !sq||b.id.toLowerCase().includes(sq)||b.title.toLowerCase().includes(sq);}).map(b=>(
                    <tr key={b.id} className="hover:bg-green-950">
                      <td className="px-6 py-3 font-mono font-bold text-gray-400">{b.id}</td>
                      <td className="px-6 py-3"><span className="font-bold text-white text-[13px]">{b.title}</span></td>
                      <td className="px-6 py-3"><span className="inline-block px-1.5 py-0.5 bg-green-900 border border-green-700 rounded text-[10px] text-green-300 font-bold">{b.category}</span></td>
                      <td className="px-6 py-3">
                        {{available:<span className="text-emerald-300 bg-emerald-900 px-1.5 py-0.5 rounded font-bold">在庫</span>,borrowed:<span className="text-blue-300 bg-blue-900 px-1.5 py-0.5 rounded font-bold">借出</span>,maintenance:<span className="text-amber-300 bg-amber-900 px-1.5 py-0.5 rounded font-bold">保養</span>,lost:<span className="text-red-300 bg-red-900 px-1.5 py-0.5 rounded font-bold">遺失</span>}[b.status]}
                      </td>
                      <td className="px-6 py-3">{b.borrowerId?<div><span className="font-semibold text-gray-200">{b.borrowerName}</span><div className="text-slate-400 font-mono text-[10px]">員編: {b.borrowerId}</div></div>:<span className="text-gray-500">-</span>}</td>
                      <td className="px-6 py-3 text-right">
                        <div className="flex items-center justify-end gap-1.5">
                          <button onClick={()=>startEditBook(b)} className="p-1 rounded cursor-pointer" style={{color:"#6aaa6a"}}><Icons.Edit3 size={16}/></button>
                          <button onClick={()=>{if(confirm(`確定要刪除《${b.title}》嗎？`))onDeleteBook(b.id);}} className="p-1 text-rose-400 hover:text-rose-600 hover:bg-rose-50 rounded cursor-pointer"><Icons.Trash2 size={16}/></button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* TAB: USERS */}
      {tab==='users' && (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center gap-3 bg-white p-5 rounded-xl border border-slate-100">
            <div className="relative flex-1">
              <Icons.Search size={16} cls="text-slate-400 absolute left-3 top-3"/>
              <input type="text" placeholder="輸入同仁姓名或員編快速搜尋..." className="w-full pl-9 pr-4 py-2 border rounded-lg text-xs" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} value={userSearch} onChange={e=>setUserSearch(e.target.value)}/>
            </div>
            <button onClick={()=>{setUserFormErr('');setUserForm({employeeId:'',name:'',role:'user',password:''});setShowUserForm(!showUserForm);}} className="py-2 px-4 text-white font-bold rounded-lg text-xs flex items-center gap-1.5 cursor-pointer self-start sm:self-auto" style={{background:"linear-gradient(135deg,#2d6a2d,#4a8a4a)"}}>
              <Icons.Plus size={14}/> 新增同仁帳號
            </button>
          </div>

          {showUserForm && (
            <div className="bg-white p-6 border border-indigo-100 shadow-md rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white">登錄新的成員帳戶</h3>
              <form onSubmit={handleUserSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
                <div><label className="block text-gray-300 mb-1 font-semibold">員工編號 (7 碼) *</label><input type="text" required maxLength={7} className="w-full px-3 py-2 border rounded-lg focus:ring-1 focus:ring-green-500 font-mono" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} placeholder="0804431" value={userForm.employeeId} onChange={e=>setUserForm({...userForm,employeeId:e.target.value.replace(/[^a-zA-Z0-9]/g,'')})}/><p className="text-[10px] text-slate-400 mt-1">{userForm.employeeId.length}/7 碼</p></div>
                <div><label className="block text-gray-300 mb-1 font-semibold">同仁姓名 *</label><input type="text" required className="w-full px-3 py-2 border rounded-lg focus:ring-1 focus:ring-green-500" style={{background:"#0d1f0d",borderColor:"#3a6a3a",color:"#e8f5e8"}} placeholder="王大明" value={userForm.name} onChange={e=>setUserForm({...userForm,name:e.target.value})}/></div>

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [books, setBooks] = useState([]);
  const [users, setUsers] = useState([]);
  const [borrows, setBorrows] = useState([]);
  const [audits, setAudits] = useState([]);
  const [currentUser, setCurrentUser] = useState(null);
  const [tab, setTab] = useState('catalog');
  const [showConfig, setShowConfig] = useState(false);
  const [showLogin, setShowLogin] = useState(false);
  const [sbCfg, setSbCfg] = useState({url:'',anonKey:'',isConnected:false});
  const [loading, setLoading] = useState(true);

  const loadAll = async () => {
    setLoading(true);
    try {
      const [b,u,r,a] = await Promise.all([fetchBooks(),fetchUsers(),fetchBorrows(),fetchAudits()]);
      setBooks(b); setUsers(u); setBorrows(r); setAudits(a); setSbCfg(getCfg());
    } catch(e){ console.error('Load error:', e); }
    finally { setLoading(false); }
  };
  useEffect(()=>{ loadAll(); }, []);
  useEffect(()=>{ if(currentUser){ const u=users.find(u=>u.employeeId===currentUser.employeeId); if(u) setCurrentUser(u); } }, [users]);

  const handleBorrow = async (bookId) => {
    if (!currentUser) return;
    const book = books.find(b=>b.id===bookId);
    if (!book||book.status!=='available') return;
    const today = new Date().toISOString().split('T')[0];
    const due = new Date(); due.setDate(due.getDate()+14); const dueStr = due.toISOString().split('T')[0];
    await saveBook({...book,status:'borrowed',borrowerId:currentUser.employeeId,borrowerName:currentUser.name,borrowDate:today,dueDate:dueStr});
    await saveBorrow({id:'REC'+Math.floor(Math.random()*90000+10000),bookId:book.id,bookTitle:book.title,employeeId:currentUser.employeeId,employeeName:currentUser.name,borrowDate:today,expectedReturnDate:dueStr,actualReturnDate:null,status:'active'});
    await loadAll();
  };
  const handleReturn = async (bookId) => {
    const book = books.find(b=>b.id===bookId);
    if (!book||book.status!=='borrowed') return;
    const log = borrows.find(r=>r.bookId===bookId&&r.status==='active');
    await saveBook({...book,status:'available',borrowerId:null,borrowerName:null,borrowDate:null,dueDate:null});
    if (log) await saveBorrow({...log,actualReturnDate:new Date().toISOString().split('T')[0],status:'returned'});
    await loadAll();
  };
  const handleAddBook = async (b) => { await saveBook(b); await loadAll(); };
  const handleDelBook = async (id) => { await deleteBook(id); await loadAll(); };
  const handleUpdBook = async (b) => { await saveBook(b); await loadAll(); };
  const handleAddUser = async (u) => { await saveUser(u); await loadAll(); };
  const handleDelUser = async (eid) => { await deleteUser(eid); await loadAll(); };
  const handleSaveAudit = async (audit) => {
    await saveAudit(audit);
    for (const d of audit.details) {
      const b = books.find(bk=>bk.id===d.bookId);
      if (b) {
        let upd = null;
        if (d.actualStatus==='missing'&&b.status!=='lost') upd={...b,status:'lost'};
        else if (d.actualStatus==='maintenance'&&b.status!=='maintenance') upd={...b,status:'maintenance'};
        else if (d.actualStatus==='present'&&b.status==='lost') upd={...b,status:'available'};
        if (upd) await saveBook(upd);
      }
    }
    await loadAll();
  };
  const handleChangePwd = async (oldP, newP) => {
    if (!currentUser) return {success:false,message:'尚未登入。'};
    if (currentUser.password!==oldP) return {success:false,message:'目前密碼驗證不正確。'};
    const upd = {...currentUser, password:newP};
    await saveUser(upd); setCurrentUser(upd); await loadAll();
    return {success:true,message:'密碼更新成功。'};
  };
  const handleLogin = (user) => { setCurrentUser(user); setShowLogin(false); setTab(user.role==='admin'?'admin':'dashboard'); };
  const handleLogout = () => { setCurrentUser(null); setTab('catalog'); };

  return (
    <div className="min-h-screen flex flex-col font-sans text-slate-800" style={{backgroundColor:"#1a2a1a"}}>
      {/* HEADER */}
      <header className="sticky top-0 z-40 shadow-md" style={{background:"linear-gradient(135deg,#0d1f0d 0%,#1a3a1a 50%,#0d1f0d 100%)",borderBottom:"3px solid #4a8a4a"}}>
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex items-center justify-between h-16">
            <div className="flex items-center">
              <h1 className="text-base font-bold leading-tight" style={{color:"#c8e6c8"}}>5A 圖書管理系統</h1>
            </div>
            <nav className="hidden md:flex gap-1.5 text-xs font-bold">
              {[['catalog','圖書檢索首頁',null],currentUser&&['dashboard','個人借閱書架',null],currentUser&&currentUser.role==='admin'&&['admin','系統後台管理','shield']].filter(Boolean).map(([k,label,ico])=>(
                <button key={k} onClick={()=>setTab(k)} style={tab===k?{background:'rgba(74,138,74,0.30)',color:'#a8d5a8'}:{color:'#7ab87a'}} className="px-3.5 py-2 rounded-lg cursor-pointer transition-all flex items-center gap-1 hover:opacity-90">
                  {ico&&<Icons.Shield size={12} cls="text-indigo-500"/>}{label}
                </button>
              ))}
            </nav>
            <div className="flex items-center gap-3 text-xs">
              {currentUser ? (
                <div className="flex items-center gap-2">
                  <div className="hidden sm:block text-right leading-tight">
                    <div className="font-bold text-white">{currentUser.name}</div>
                    <div className="text-[10px] text-slate-400 font-mono">員編:{currentUser.employeeId}</div>
                  </div>
                  <button className="p-1.5 rounded-lg cursor-pointer" style={{background:"rgba(255,255,255,0.10)",color:"#c8e6c8",border:"1px solid rgba(74,138,74,0.5)"}} onClick={()=>setTab('dashboard')} title="帳戶中心"><Icons.User size={14}/></button>
                  <button onClick={handleLogout} className="p-1.5 rounded-lg cursor-pointer" style={{color:"#7ab87a"}} onMouseEnter={e=>e.currentTarget.style.color='#fca5a5'} onMouseLeave={e=>e.currentTarget.style.color='#7ab87a'} title="安全登出"><Icons.LogOut size={14}/></button>
                </div>
              ) : (
                <button onClick={()=>setShowLogin(true)} className="py-1.5 px-3.5 font-bold rounded-lg flex items-center gap-1.5 cursor-pointer shadow-sm" style={{background:"linear-gradient(135deg,#2d6a2d,#4a8a4a)",color:"#e8f5e8"}}>
                  <Icons.LogIn size={13}/> 登入
                </button>
              )}
            </div>
          </div>
        </div>
      </header>

      {/* MOBILE NAV */}
      {currentUser && (
        <div className="flex md:hidden text-xs font-bold justify-around py-2.5 px-2" style={{background:"#0d1f0d",borderBottom:"2px solid #4a8a4a"}}>
          {[['catalog','檢索首頁'],['dashboard','借閱書架'],currentUser.role==='admin'&&['admin','系統後台']].filter(Boolean).map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} style={tab===k?{background:'rgba(74,138,74,0.3)',color:'#a8d5a8'}:{color:'#7ab87a'}} className="py-1 px-3 rounded-md cursor-pointer">{l}</button>
          ))}
        </div>
      )}

      {/* MAIN */}
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {loading ? (
          <div className="flex flex-col items-center justify-center py-24 space-y-3">
            <Icons.Loader2 size={40} cls="text-indigo-600"/>
            <p className="text-xs text-slate-500 font-bold">載入圖書庫中，請稍候...</p>
          </div>
        ) : (
          <>
            {tab==='catalog' && <BookCatalog books={books} currentUser={currentUser} onBorrowBook={handleBorrow} onReturnBook={handleReturn}/>}
            {tab==='dashboard' && currentUser && <UserDashboard currentUser={currentUser} books={books} onReturnBook={handleReturn} onChangePassword={handleChangePwd} onLogout={handleLogout}/>}
            {tab==='admin' && currentUser && currentUser.role==='admin' && <AdminPanel books={books} users={users} borrowRecords={borrows} auditSessions={audits} currentUser={currentUser} onAddBook={handleAddBook} onDeleteBook={handleDelBook} onUpdateBook={handleUpdBook} onAddUser={handleAddUser} onDeleteUser={handleDelUser} onSaveAuditSession={handleSaveAudit}/>}
          </>
        )}
      </main>

      <SupabaseConfigModal isOpen={showConfig} onClose={()=>setShowConfig(false)} onConfigChanged={loadAll}/>

      {showLogin && (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="relative w-full max-w-md">
            <button onClick={()=>setShowLogin(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 z-10 text-lg font-bold">✕</button>
            <LoginScreen onLoginSuccess={handleLogin} users={users}/>
          </div>
        </div>
      )}

      <footer className="py-6 text-center text-xs" style={{background:"#0d1f0d",borderTop:"2px solid #4a8a4a",color:"#5a8a5a"}}>
        <div className="max-w-7xl mx-auto px-4 space-y-2">
          <p>內部圖書館管理系統 &copy; 2026. 供單位人員線上查詢與書籍登記流通專用。</p>
          <div className="flex justify-center">
            <button onClick={()=>setShowConfig(true)} className={`py-1 px-2.5 rounded-full border flex items-center gap-1 font-semibold cursor-pointer transition-all ${sbCfg.isConnected?'bg-emerald-900 border-emerald-600 text-emerald-300 hover:bg-emerald-800':'border-green-700 text-green-400 hover:opacity-80'}`} style={sbCfg.isConnected?{}:{background:'rgba(74,138,74,0.15)'}}>
              <span className={`w-1.5 h-1.5 rounded-full ${sbCfg.isConnected?'bg-emerald-500 animate-pulse':'bg-amber-400'}`}/>
              {sbCfg.isConnected?'雲端同步中':'LocalStorage 離線'}
              <Icons.Settings size={10} cls="opacity-60 ml-0.5"/>
            </button>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
